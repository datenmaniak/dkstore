<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Demo Ghost Buttons</title>
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="/build/css/main.css" />
  <!-- tu archivo compilado -->
</head>

<body style="padding:2rem; background:#f5f5f5;">

  <h2>Ghost Buttons Demo</h2>

  <!-- Ghost básico -->
  <button class="btn-ghost">Ghost básico</button>

  <!-- Ghost + tamaños -->
  <button class="btn-ghost btn-block-75">Ghost 75%</button>
  <button class="btn-ghost btn-block-50">Ghost 50%</button>
  <button class="btn-ghost btn-block-30">Ghost 30%</button>
  <button class="btn-ghost btn-block-20">Ghost 20%</button>
  <button class="btn-ghost btn-block-10">Ghost 10%</button>

  <hr>

  <!-- Ghost + posiciones -->
  <div style="width:100%; background:#eee; padding:1rem;">
    <button class="btn-ghost btn-block-30 btn-left">Ghost izquierda</button>
    <button class="btn-ghost btn-block-30 btn-center">Ghost centrado</button>
    <button class="btn-ghost btn-block-30 btn-right">Ghost derecha</button>
  </div>

</body>

</html>
