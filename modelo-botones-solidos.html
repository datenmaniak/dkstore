<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Demo Botones</title>
  <link rel="stylesheet" href="css/buttons.css"> <!-- tu archivo compilado -->
  <link rel="stylesheet" href="/build/css/main.css" />
  <style>
    body {
      padding: 2rem;
      background: #f5f5f5;
      font-family: sans-serif;
    }

    section {
      margin-bottom: 2rem;
    }

    h2 {
      margin-bottom: 1rem;
    }

    .demo-box {
      background: #eee;
      padding: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <h1>Demo de Botones</h1>

  <!-- Botones sólidos -->
  <section>
    <h2>Botones sólidos</h2>
    <button class="btn-primary">Primario</button>
    <button class="btn-secondary">Secundario</button>
    <button class="btn-danger">Peligro</button>
    <button class="btn-success">Éxito</button>
    <button class="btn-warning">Warning</button>

    <div class="demo-box">
      <button class="btn-primary btn-block-50 btn-left">Primario 50% izquierda</button>
      <button class="btn-secondary btn-block-30 btn-center">Secundario 30% centrado</button>
      <button class="btn-danger btn-block-20 btn-right">Peligro 20% derecha</button>
    </div>
  </section>

  <!-- Botones ghost -->
  <section>
    <h2>Botones ghost</h2>
    <button class="btn-ghost">Ghost básico</button>

    <div class="demo-box">
      <button class="btn-ghost btn-block-75">Ghost 75%</button>
      <button class="btn-ghost btn-block-50">Ghost 50%</button>
      <button class="btn-ghost btn-block-30">Ghost 30%</button>
    </div>

    <div class="demo-box">
      <button class="btn-ghost btn-block-30 btn-left">Ghost izquierda</button>
      <button class="btn-ghost btn-block-30 btn-center">Ghost centrado</button>
      <button class="btn-ghost btn-block-30 btn-right">Ghost derecha</button>
    </div>
  </section>

</body>

</html>
