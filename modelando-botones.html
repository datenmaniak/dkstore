<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejemplo Botones</title>
    <link rel="stylesheet" href="build/css/main.css">
</head>

<body>

    <!-- Sección 1: bloque con botón normal -->
    <section class="section-normal">
        <h2>Sección con botón estándar</h2>
        <p>Este bloque simula contenido con un botón normal:</p>
        <button>Botón estándar</button>
    </section>

    <!-- Sección 2: flex con 4 columnas -->
    <section class="flex-section">
        <div class="col">Columna 1</div>
        <div class="col">Columna 2</div>
        <div class="col">Columna 3</div>
        <div class="col">
            <button class="btn btn-block">Botón 80%</button>
        </div>
    </section>
    <hr>
    <!-- Botón ghost como acción secundaria -->
    <button class="btn-ghost">Cancelar</button>

    <!-- También puede aplicarse a enlaces -->
    <a href="#" class="btn-ghost">Más info</a>

    <hr>
    <!-- Botón estándar -->
    <button>Enviar</button>

    <!-- Botón bloque -->
    <button class="btn-block">Botón ancho completo</button>



</body>

</html>
