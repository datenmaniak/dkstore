<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de notificaciones</title>
  <link rel="stylesheet" href="/build/css/main.css" />

</head>

<body>


  <div class="notification-bar success left">
    <span class="icon">✔️</span>
    <span class="message">Operación realizada con éxito</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar error center">
    <span class="icon">⚠️</span>
    <span class="message">Ha ocurrido un error</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar info right">
    <span class="icon">ℹ️</span>
    <span class="message">Información importante</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar success small left">
    <span class="icon">✔️</span>
    <span class="message">Éxito pequeño</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar error large center">
    <span class="icon">⚠️</span>
    <span class="message">Error grande</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar success small center">
    <span class="icon">✔️</span>
    <span class="message">Éxito pequeño</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar error medium center">
    <span class="icon">⚠️</span>
    <span class="message">Error ancho medio</span>
    <span class="close-btn">✖</span>
  </div>

  <div class="notification-bar info large right">
    <span class="icon">ℹ️</span>
    <span class="message">Info ancho completo</span>
    <span class="close-btn">✖</span>
  </div>


</body>

</html>
